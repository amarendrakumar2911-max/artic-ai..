<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artic AI — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-matte: #06080c;
      --bg-surface: #0c1017;
      --bg-elevated: #121822;
      --border-subtle: rgba(56, 189, 248, 0.16);
      --border-glow: rgba(56, 189, 248, 0.48);
      --blue-primary: #0ea5e9;
      --blue-bright: #38bdf8;
      --blue-deep: #0284c7;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-matte);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Matte Black + Arctic Blue Cyber Grid & Glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(14, 165, 233, 0.18), transparent 55%),
        radial-gradient(circle at 85% 95%, rgba(2, 132, 199, 0.12), transparent 45%),
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Glass Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(12, 16, 23, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.24), rgba(2, 132, 199, 0.08));
      border: 1px solid var(--border-glow);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.28);
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 14px rgba(56, 189, 248, 0.22); }
      50% { box-shadow: 0 0 26px rgba(56, 189, 248, 0.5); }
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--blue-bright);
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .logout-btn {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 15px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(18, 24, 34, 0.7);
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      color: #fff;
      border-color: var(--blue-bright);
      background: rgba(14, 165, 233, 0.16);
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.25);
    }

    /* Custom Matte Dark Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.25);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.5);
    }

    /* Chat Container */
    #chat-container {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .sender-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 5px;
      padding: 0 4px;
    }

    .message-row.bot .sender-label {
      color: var(--blue-bright);
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.62;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message-row.user .bubble {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.28);
    }

    .message-row.bot .bubble {
      background: rgba(12, 16, 23, 0.9);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Markdown & Code Formatting */
    .bubble h1, .bubble h2, .bubble h3 {
      color: var(--blue-bright);
      margin: 12px 0 6px;
      font-size: 1.05rem;
    }
    .bubble p { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol {
      margin: 8px 0 10px 20px;
    }
    .bubble li { margin-bottom: 4px; }
    .bubble strong { color: #ffffff; }
    .bubble a { color: var(--blue-bright); text-decoration: underline; }

    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.86rem;
    }

    .code-wrapper {
      position: relative;
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: #040609;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #0b0f17;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      font-size: 0.74rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .copy-btn {
      background: rgba(14, 165, 233, 0.14);
      color: var(--blue-bright);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: var(--blue-primary);
      color: #fff;
    }

    .code-wrapper pre {
      padding: 14px;
      overflow-x: auto;
      margin: 0;
    }

    .code-wrapper pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* Typing Indicator */
    .typing-dots {
      display: inline-flex;
      gap: 5px;
      padding: 4px 2px;
    }
    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue-bright);
      animation: bounce 1.3s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Quick Action Chips + Input Dock */
    .dock-wrapper {
      position: relative;
      z-index: 10;
      background: linear-gradient(to top, var(--bg-matte) 70%, transparent);
      padding: 10px 18px 22px;
    }

    .dock-inner {
      max-width: 920px;
      margin: 0 auto;
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .chip {
      white-space: nowrap;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(12, 16, 23, 0.88);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      color: #fff;
      border-color: var(--blue-bright);
      background: rgba(14, 165, 233, 0.16);
      transform: translateY(-1px);
    }

    .input-bar {
      display: flex;
      gap: 10px;
      background: rgba(12, 16, 23, 0.94);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.65);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-bar:focus-within {
      border-color: var(--blue-bright);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.25);
    }

    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.96rem;
      padding: 8px 12px;
      font-family: inherit;
    }

    #message-input::placeholder {
      color: #64748b;
    }

    #send-btn {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.35);
      transition: all 0.2s ease;
    }

    #send-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(56, 189, 248, 0.55);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/>
        </svg>
      </div>
      <span class="brand-title">ARTIC AI</span>
      <span class="status-pill"><span class="status-dot"></span> Online</span>
    </div>
    <a href="/logout" class="logout-btn">Logout</a>
  </header>

  <main id="chat-container">
    <div class="message-row bot">
      <span class="sender-label">Artic Core</span>
      <div class="bubble">
        Welcome back. Systems online — ask me for a <strong>morning briefing</strong>, check your <strong>unread emails</strong>, save cloud notes, search the web, or write code.
      </div>
    </div>
  </main>

  <div class="dock-wrapper">
    <div class="dock-inner">
      <div class="quick-chips">
        <button type="button" class="chip" onclick="quickSend('Give me my morning briefing')">☀️ Morning Briefing</button>
        <button type="button" class="chip" onclick="quickSend('Check my unread emails')">📬 Unread Emails</button>
        <button type="button" class="chip" onclick="quickSend('List my saved notes')">📝 Saved Notes</button>
        <button type="button" class="chip" onclick="quickSend('What is the weather in Hyderabad?')">🌦️ Hyderabad Weather</button>
      </div>
      <form class="input-bar" id="chat-form">
        <input type="text" id="message-input" placeholder="Command Artic..." autocomplete="off" required />
        <button type="submit" id="send-btn">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    function formatBotMarkdown(text) {
      const rawHtml = marked.parse(text);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = rawHtml;

      tempDiv.querySelectorAll('pre').forEach((pre) => {
        const codeEl = pre.querySelector('code');
        const langClass = codeEl ? Array.from(codeEl.classList).find(c => c.startsWith('language-')) : '';
        const lang = langClass ? langClass.replace('language-', '') : 'code';

        const wrapper = document.createElement('div');
        wrapper.className = 'code-wrapper';

        const header = document.createElement('div');
        header.className = 'code-header';
        header.innerHTML = `<span>${lang}</span><button type="button" class="copy-btn">Copy</button>`;

        const btn = header.querySelector('.copy-btn');
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(pre.innerText);
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = 'Copy'), 1600);
        });

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });

      return tempDiv;
    }

    function appendMessage(text, sender) {
      const row = document.createElement('div');
      row.className = `message-row ${sender}`;

      const label = document.createElement('span');
      label.className = 'sender-label';
      label.textContent = sender === 'user' ? 'You' : 'Artic Core';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (sender === 'bot') {
        bubble.appendChild(formatBotMarkdown(text));
      } else {
        bubble.textContent = text;
      }

      row.appendChild(label);
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'message-row bot';
      row.id = 'typing-row';
      row.innerHTML = `
        <span class="sender-label">Artic Core</span>
        <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
      `;
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
      const row = document.getElementById('typing-row');
      if (row) row.remove();
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      appendMessage(text, 'user');
      messageInput.value = '';
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        removeTyping();
        appendMessage(data.reply || data.error || 'No response.', 'bot');
      } catch (err) {
        removeTyping();
        appendMessage('Connection error reaching Artic server.', 'bot');
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    function quickSend(promptText) {
      sendMessage(promptText);
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(messageInput.value);
    });
  </script>
</body>
</html>
