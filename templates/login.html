<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artic AI — Secure Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #06080c;
      color: #f1f5f9;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(14, 165, 233, 0.2), transparent 55%),
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
    }
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      padding: 36px 32px;
      background: rgba(12, 16, 23, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.24);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(14, 165, 233, 0.14);
      text-align: center;
    }
    .logo-ring {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(2, 132, 199, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.45);
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.3);
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #fff, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p.sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.24);
      background: #06080c;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.24);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
    }
    .error {
      margin-top: 14px;
      font-size: 0.84rem;
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-ring">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/>
      </svg>
    </div>
    <h1>ARTIC AI</h1>
    <p class="sub">Enter access key to initialize agent session</p>
    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="Access Password" required autofocus />
      <button type="submit">Unlock Dashboard</button>
    </form>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
